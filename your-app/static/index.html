<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>忘れ物防止App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="header">
      <h1> 忘れ物防止 App👜</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="todo-card">
      <!-- エラーメッセージ表示エリア -->
      <div id="error-message" class="error-message" style="display: none"></div>

      <!-- TODO入力エリア -->
      <form id="todo-form" class="input-area">
        <div class="input-row">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="忘れたくない持ち物を入力..."
            maxlength="100"
            autocomplete="off"
          />

          <input type="text" id="todo-scene" class="todo-input" placeholder="シーン (ex)旅行、出張など)" maxlength="50"/>
        </div>
        
        <button type="submit" class="todo-button">リストに追加</button>
      </form>

      <!-- TODOリスト -->
       <h2 class="setumei">👇こちらに入力したものが表示されます👇</h2>
       <p class="syousai">忘れずに詰め込んだら左のチェックボタンを押してください</p>
      <ul id="todo-list" class="todo-list"></ul>

      <div class="history-section">
        <h2 class="history-title">削除した履歴</h2>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </main>

    <!-- フッター -->
    <footer class="footer">
      <p>&copy; 2026 TODO App</p>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
